<!DOCTYPE html>
<html>
<head>
    <title>UM Page</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width">

    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <style type="text/css">       
        body {
            font-family: Roboto, sans-serif;
            font-size: 15px;
            background: #f8f5ec;
            color: #333333;
            width: 100%;
            margin: 0;
        }


        .text-bold {
            font-weight: bold;
        }

        .container {
            max-width: 768px;
            margin: 0 auto;
            padding-top: 80px;
            text-align: center;
        }

            .container .img {
                margin-top: 50px;
            }

        h1 {
            color: #2b4266;
            font-size: 30px;
        }

        .caption {
            padding-top: 30px;
        }

            .caption p {
                margin: 10px;
            }

        .img {
            position: relative;
            width: 422px;
            margin: 0 auto;
        }

            .img .setting {
                position: absolute;
                -webkit-animation: spin 4s linear infinite;
                -moz-animation: spin 4s linear infinite;
                animation: spin 4s linear infinite;
            }

            .img .setting-1 {
                top: 64px;
                right: 207px;
            }

            .img .setting-2 {
                top: 114px;
                right: 233px;
            }

        @-moz-keyframes spin {
            100% {
                -moz-transform: rotate(360deg);
            }
        }

        @-webkit-keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @media (max-width: 424px) {
            .container {
                width: 100%;
                padding-top: 0;
            }

            .img {
                width: 100%;
            }

                .img .bg {
                    width: 100%;
                }

                .img .setting-1 {
                    top: 56px;
                    right: 182px;
                }

                .img .setting-2 {
                    top: 114px;
                    right: 209px;
                }
        }

        @media (max-width: 767px) {
            .container {
                padding-top: 0;
            }
        }
    </style>

</head>
